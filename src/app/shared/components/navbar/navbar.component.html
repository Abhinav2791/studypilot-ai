<nav class="navbar" [class.is-scrolled]="isScrolled" [class.is-dark-bg]="!isLandingPage()" role="navigation" aria-label="Main navigation">
  <div class="navbar__container">

    <!-- Logo -->
    <a class="navbar__logo" routerLink="/" aria-label="StudyPilot AI Home">
      <div class="logo-symbol" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="12.5" stroke="url(#logoGrad)" stroke-width="1.5" fill="none"/>
          <path d="M14 3 L17 10.5 L14 9 L11 10.5 Z" fill="url(#logoGrad)"/>
          <path d="M14 25 L11 17.5 L14 19 L17 17.5 Z" fill="rgba(168,160,255,0.5)"/>
          <circle cx="14" cy="14" r="2.5" fill="url(#logoGrad)"/>
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
              <stop stop-color="#8175F5"/>
              <stop offset="1" stop-color="#A8A0FF"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span class="logo-wordmark">
        <span class="logo-text">StudyPilot</span>
        <span class="logo-accent">AI</span>
      </span>
    </a>

    <!-- Desktop Nav Links -->
    <ul class="navbar__links" role="list">
      <!-- Home -->
      <li>
        <a routerLink="/" class="navbar__link" [class.is-active]="isLandingPage()">
          Home
        </a>
      </li>

      <!-- Features (Dropdown) -->
      <li class="nav-item-dropdown" (mouseenter)="openFeaturesDropdown()" (mouseleave)="closeFeaturesDropdown()">
        <button class="navbar__link navbar__link--dropdown"
                [class.is-open]="isFeaturesDropdownOpen"
                (click)="toggleFeaturesDropdown($event)"
                type="button"
                aria-haspopup="true"
                [attr.aria-expanded]="isFeaturesDropdownOpen">
          <span>Features</span>
          <svg class="dropdown-chevron" [class.is-rotated]="isFeaturesDropdownOpen" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        <!-- Features Dropdown Menu -->
        <div class="features-dropdown-menu" [class.is-visible]="isFeaturesDropdownOpen" role="menu">
          <div class="dropdown-arrow"></div>
          <div class="dropdown-header">
            <span class="dropdown-eyebrow">INTELLIGENT LEARNING SUITE</span>
            <span class="dropdown-sub">Everything you need to master your syllabus</span>
          </div>

          <div class="dropdown-grid">
            <a *ngFor="let opt of featureOptions"
               (click)="navigateToFeature(opt.route)"
               class="dropdown-card"
               role="menuitem"
               tabindex="0">
              <div class="opt-icon" [style.background]="opt.color + '18'" [style.color]="opt.color">
                <!-- Calendar -->
                <svg *ngIf="opt.icon === 'calendar'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <!-- Book -->
                <svg *ngIf="opt.icon === 'book'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                <!-- Cards -->
                <svg *ngIf="opt.icon === 'cards'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="11" x2="12" y2="15"/><line x1="10" y1="13" x2="14" y2="13"/></svg>
                <!-- Help/Quiz -->
                <svg *ngIf="opt.icon === 'help'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                <!-- Message/Coach -->
                <svg *ngIf="opt.icon === 'message'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <!-- Clock/Focus -->
                <svg *ngIf="opt.icon === 'clock'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <!-- Chart/Analytics -->
                <svg *ngIf="opt.icon === 'chart'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                <!-- Layers/Settings -->
                <svg *ngIf="opt.icon === 'layers'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
              </div>
              <div class="opt-body">
                <div class="opt-title-row">
                  <span class="opt-title">{{ opt.label }}</span>
                  <span class="opt-badge" *ngIf="opt.badge">{{ opt.badge }}</span>
                </div>
                <span class="opt-desc">{{ opt.desc }}</span>
              </div>
            </a>
          </div>

          <div class="dropdown-footer">
            <button class="footer-link-btn" (click)="scrollTo('#features')">
              <span>View interactive feature breakdown on landing page</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
          </div>
        </div>
      </li>

      <!-- How It Works -->
      <li>
        <button class="navbar__link navbar__link--anchor"
                (click)="scrollTo('#how-it-works')"
                type="button">
          How It Works
        </button>
      </li>

      <!-- AI Study Coach -->
      <li>
        <a routerLink="/coach" class="navbar__link" [class.is-active]="currentRoute === '/coach'">
          AI Study Coach
        </a>
      </li>

      <!-- Pricing -->
      <li>
        <button class="navbar__link navbar__link--anchor"
                (click)="scrollTo('#pricing')"
                type="button">
          Pricing
        </button>
      </li>
    </ul>

    <!-- Actions -->
    <div class="navbar__actions">
      <!-- Theme toggle -->
      <button class="theme-toggle btn btn--icon btn--ghost"
              (click)="toggleTheme()"
              [attr.aria-label]="isDark ? 'Switch to light mode' : 'Switch to dark mode'"
              type="button">
        <svg *ngIf="!isDark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg *ngIf="isDark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

      <!-- Sign In -->
      <button *ngIf="!isAuthenticated"
              class="btn btn--ghost btn--sm"
              (click)="navigateToSignIn()"
              type="button">
        Sign In
      </button>

      <!-- Dashboard (authenticated) -->
      <button *ngIf="isAuthenticated"
              class="btn btn--ghost btn--sm"
              (click)="navigateToDashboard()"
              type="button">
        Dashboard
      </button>

      <!-- CTA -->
      <button class="btn btn--primary btn--sm get-started-btn"
              (click)="navigateToGetStarted()"
              type="button">
        <span>Get Started</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>

      <!-- Mobile menu toggle -->
      <button class="mobile-menu-btn btn btn--icon btn--ghost"
              (click)="toggleMobileMenu()"
              [attr.aria-expanded]="isMobileMenuOpen"
              aria-controls="mobile-menu"
              aria-label="Toggle navigation menu"
              type="button">
        <svg *ngIf="!isMobileMenuOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
        <svg *ngIf="isMobileMenuOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer -->
  <div class="mobile-drawer"
       id="mobile-menu"
       [class.is-open]="isMobileMenuOpen"
       role="dialog"
       aria-label="Mobile navigation">
    <div class="mobile-drawer__overlay" (click)="closeMobileMenu()"></div>
    <div class="mobile-drawer__panel">

      <div class="mobile-drawer__header">
        <div class="logo-wordmark">
          <span class="logo-text">StudyPilot</span>
          <span class="logo-accent">AI</span>
        </div>
        <button class="btn btn--icon btn--ghost" (click)="closeMobileMenu()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="mobile-nav-scroll">
        <!-- Main links -->
        <div class="mobile-section-title">Navigation</div>
        <ul class="mobile-nav-links" role="list">
          <li>
            <a routerLink="/" class="mobile-nav-link" (click)="closeMobileMenu()">Home</a>
          </li>
          <li>
            <button class="mobile-nav-link mobile-nav-link--btn" (click)="scrollTo('#how-it-works')">How It Works</button>
          </li>
          <li>
            <a routerLink="/coach" class="mobile-nav-link" (click)="closeMobileMenu()">AI Study Coach</a>
          </li>
          <li>
            <button class="mobile-nav-link mobile-nav-link--btn" (click)="scrollTo('#pricing')">Pricing & Plans</button>
          </li>
        </ul>

        <!-- Features expandable list -->
        <div class="mobile-section-header" (click)="toggleMobileFeatures()">
          <span class="mobile-section-title">All StudyPilot Features</span>
          <svg class="chevron" [class.rotated]="isMobileFeaturesOpen" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>

        <div class="mobile-features-list" *ngIf="isMobileFeaturesOpen">
          <a *ngFor="let opt of featureOptions"
             (click)="navigateToFeature(opt.route)"
             class="mobile-feature-item">
            <span class="m-icon" [style.color]="opt.color">✦</span>
            <div class="m-content">
              <span class="m-title">{{ opt.label }}</span>
              <span class="m-desc">{{ opt.desc }}</span>
            </div>
            <span class="m-badge" *ngIf="opt.badge">{{ opt.badge }}</span>
          </a>
        </div>
      </div>

      <div class="mobile-drawer__actions">
        <button *ngIf="!isAuthenticated"
                class="btn btn--ghost"
                style="width:100%"
                (click)="navigateToSignIn()">
          Sign In
        </button>
        <button *ngIf="isAuthenticated"
                class="btn btn--secondary"
                style="width:100%"
                (click)="navigateToDashboard()">
          Open Dashboard
        </button>
        <button class="btn btn--primary"
                style="width:100%"
                (click)="navigateToGetStarted()">
          Get Started Free
        </button>
      </div>

    </div>
  </div>
</nav>
